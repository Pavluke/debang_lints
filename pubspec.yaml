name: debang_lints
description: Analyzer plugin for debang package. Enforces descriptive assertion messages with minimum length validation.
version: 1.0.0
repository: https://github.com/pavluke/debang_lints
homepage: https://github.com/pavluke/debang_lints
issue_tracker: https://github.com/pavluke/debang_lints/issues

topics:
  - linter
  - analyzer
  - code-quality
  - debang
  - static-analysis

environment:
  sdk: ^3.6.0

dependencies:
  analysis_server_plugin: ^0.3.4
  analyzer: ^9.0.0

dev_dependencies:
  lints: ^6.0.0

plugin_type: analyzer_plugin
