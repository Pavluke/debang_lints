name: debang_lints
description: A Dart analyzer plugin for the debang package that enforces
  descriptive assertion messages and requires author attribution in debang()
  calls.
version: 1.1.0
repository: https://github.com/pavluke/debang_lints
homepage: https://github.com/pavluke/debang_lints
issue_tracker: https://github.com/pavluke/debang_lints/issues

topics:
  - linter
  - analyzer
  - code-quality
  - debang
  - static-analysis

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  analysis_server_plugin: ^0.3.14
  analyzer: ^12.1.0

dev_dependencies:
  lints: ^6.1.0

plugin_type: analyzer_plugin
